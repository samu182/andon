[package]
name = "andon"
version = "0.1.0"
edition = "2024"

# 描き方を 2 つから選ぶ（2026-10-06 に比べるために両方置いた）
#   cpu（既定）: CPU で描く（egui_software_backend）。GPU のドライバーを読み込まないので軽い
#   gpu: GPU で描く（eframe + glow）。cargo build --no-default-features --features gpu
[features]
default = ["cpu"]
cpu = ["dep:egui_software_backend"]
gpu = ["dep:eframe"]

[dependencies]
# egui_software_backend が 0.34 なので、egui もそれにそろえる
egui = { version = "0.34", features = ["default_fonts"] }
egui_software_backend = { version = "0.0.3", optional = true }
# GPU 版は glow（OpenGL）。既定の wgpu はビルドが重く、この PC のメモリでは落ちるおそれがある
eframe = { version = "0.34", default-features = false, features = ["glow", "default_fonts"], optional = true }
# コピー（arboard）と、リンクを既定のブラウザで開く（webbrowser）。CPU で描く部品は egui-winit をこれらなしで使うので足す
egui-winit = { version = "0.34", default-features = false, features = ["clipboard", "links"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
memmap2 = "0.9.11"

[profile.release]
opt-level = 2

[build-dependencies]
embed-resource = "3.0.12"

# CPU で描く部品を、直したものに差し替える（vendor/egui_software_backend/src/winit.rs の「andon の直し」）。
# 元の 0.0.3 は request_repaint_after の時刻を待たずに描き直すので、窓を開いているだけで CPU のコア 1 つを使い切った（2026-10-07）
[patch.crates-io]
egui_software_backend = { path = "vendor/egui_software_backend" }
